version: 1

# 文件名按项目约定保留为 coporations.yaml。
# 启用条件：corporation.enabled: true 时，其下所有 channel 默认启用。
# 只在需要排除某个 channel 时，为该 channel 显式添加 enabled: false。
# priority 是建议初值，可直接修改：P0 核心、P1 重要、P2 观察、P3 低优先级。
defaults:
  enabled: false
  channel_enabled: true
  disable_github_channels: true
  priority: P2
  schedule: daily
  shadow_days: 7
  language: auto

corporations:
