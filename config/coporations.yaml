    name: NVIDIA
    enabled: true
    priority: P0
    focus: [gpu, cuda, inference, training, networking, nccl]
    channels:
      - {id: technical-blog, name: Technical Blog, priority: P0, type: rss, endpoint: "https://developer.nvidia.com/blog/feed/", schedule: "6h"}
      - {id: tensorrt-llm, name: TensorRT-LLM Releases, priority: P0, type: github_release, endpoint: "https://github.com/NVIDIA/TensorRT-LLM/releases.atom", schedule: "2h", enabled: false}
      - {id: nccl, name: NCCL Releases, priority: P0, type: github_release, endpoint: "https://github.com/NVIDIA/nccl/releases.atom", schedule: "6h", enabled: false}
