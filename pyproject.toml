[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clippers-daily"
version = "0.2.0"
description = "AI infrastructure daily digest pipeline and administration console"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "lxml>=5.3,<7",
  "openai>=1.100,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "respx>=0.22,<1"]

[project.scripts]
clippers = "clippers_daily.cli:main"
clippers-web = "clippers_daily.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clippers_daily"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
