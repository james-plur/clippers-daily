server {
    listen 80;
    listen [::]:80;
    server_name paperlab.cloud;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paperlab.cloud;

    ssl_certificate /etc/letsencrypt/live/paperlab.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paperlab.cloud/privkey.pem;
    client_max_body_size 60m;

    # Clippers authenticates the console and /paperlab/, and allowlists the
    # existing PaperLab device protocol under /api/sync/.
    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
